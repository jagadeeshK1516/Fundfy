[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundfy"
version = "0.2.0"
description = "Fundfy AI Business Execution Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "arq>=0.25.0",
    "alembic>=1.13.0",
    "PyJWT>=2.8.0",
    "structlog>=23.2.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.0",
    "chromadb>=0.4.18",
    "openai>=1.6.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
    "cryptography>=41.0.0",
    "openpyxl>=3.1.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "fakeredis[lua]>=2.20.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fundfy*"]
